<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#18372e" />
    <meta name="description" content="30° 等轴森林经营地图 Web 原型" />
    <title>林地营造 · 等轴地图原型</title>
  </head>
  <body>
    <main id="app">
      <div id="game" aria-label="等轴森林经营地图"></div>
      <header class="topbar">
        <div class="brand">
          <span class="brand__mark">◆</span>
          <div><strong>林地营造</strong><small>ISOMETRIC FOREST</small></div>
        </div>
        <div id="resources" class="resources" aria-live="polite"></div>
        <button id="help-btn" class="round-btn" aria-label="帮助">?</button>
      </header>
      <aside class="status-panel">
        <span class="status-panel__eyebrow">当前任务</span>
        <strong id="task-title">建立第一座小屋</strong>
        <div class="progress"><i id="task-progress"></i></div>
        <small id="task-copy">选择“小屋”，再点击中央草地。</small>
      </aside>
      <nav class="tool-rail" aria-label="地图工具">
        <button data-mode="build" class="is-active" title="建造">⌂</button>
        <button data-mode="clear" title="清理">♣</button>
        <button data-mode="inspect" title="查看">◎</button>
      </nav>
      <section class="build-dock" aria-label="建筑菜单">
        <div class="build-dock__head">
          <div><span>建造</span><small id="mode-label">选择建筑后点击地图格</small></div>
          <div class="zoom-controls">
            <button id="zoom-out" aria-label="缩小">−</button>
            <button id="zoom-reset" aria-label="重置视角">⌖</button>
            <button id="zoom-in" aria-label="放大">＋</button>
          </div>
        </div>
        <div id="building-list" class="building-list"></div>
      </section>
      <div id="toast" class="toast" role="status"></div>
      <dialog id="help-dialog">
        <button id="help-close" class="dialog-close" aria-label="关闭">×</button>
        <h2>地图操作</h2>
        <p>选择建筑后点击中央空地；桌面端也可以把建筑卡拖到格子上。选择清理工具后点击树木可获得木材。</p>
        <ul>
          <li>30° 等轴正交，地图基准格 256 × 148 px</li>
          <li>建筑逻辑占地 1×1，美术安全画布 2×2</li>
          <li>物件与建筑按脚底位置动态排序</li>
        </ul>
      </dialog>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
