<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#132f28" />
    <meta name="description" content="等轴森林经营地图全量 SVG 素材总览" />
    <title>等轴森林地图 · 全部素材</title>
  </head>
  <body>
    <main id="app">
      <header class="hero">
        <div class="hero__inner">
          <a class="brand" href="./" aria-label="返回素材总览顶部">
            <span class="brand__mark">◆</span>
            <span><strong>等轴森林地图</strong><small>ASSET ATLAS</small></span>
          </a>
          <div class="hero__copy">
            <span class="eyebrow">30° ORTHOGRAPHIC ISOMETRIC</span>
            <h1>全部地图素材</h1>
            <p>所有地形瓦片、场景物件与建筑 SVG 集中展示在同一个页面。</p>
          </div>
          <div id="summary" class="summary" aria-live="polite">
            <div><b>—</b><span>全部素材</span></div>
            <div><b>—</b><span>地形瓦片</span></div>
            <div><b>—</b><span>场景物件</span></div>
            <div><b>—</b><span>建筑</span></div>
          </div>
        </div>
      </header>

      <section class="controls" aria-label="素材筛选">
        <div class="controls__inner">
          <label class="search">
            <span aria-hidden="true">⌕</span>
            <input id="search-input" type="search" placeholder="搜索素材名称或路径" autocomplete="off" />
            <button id="clear-search" type="button" aria-label="清空搜索" hidden>×</button>
          </label>
          <nav id="category-filter" class="category-filter" aria-label="素材分类"></nav>
          <div id="result-count" class="result-count">正在读取素材清单…</div>
        </div>
      </section>

      <div id="loading-state" class="loading-state">
        <i></i><span>正在加载全部素材</span>
      </div>
      <div id="empty-state" class="empty-state" hidden>
        <strong>没有找到对应素材</strong>
        <span>请更换关键词或分类。</span>
      </div>
      <div id="gallery" class="gallery" aria-live="polite"></div>

      <footer class="footer">
        <span>等轴森林经营地图素材库</span>
        <a href="https://github.com/xiaoQDR/ditu" target="_blank" rel="noreferrer">GitHub 仓库 ↗</a>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
