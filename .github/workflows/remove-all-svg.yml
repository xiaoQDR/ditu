name: Remove all SVG assets

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/remove-all-svg.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Delete every SVG file
        shell: bash
        run: |
          set -euo pipefail
          before="$(find . -type f -name '*.svg' | wc -l)"
          find . -type f -name '*.svg' -delete
          after="$(find . -type f -name '*.svg' | wc -l)"
          test "$after" -eq 0
          rm .github/workflows/remove-all-svg.yml
          echo "Deleted $before SVG files"
      - name: Commit cleanup to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove all SVG assets"
          git push origin HEAD:main
