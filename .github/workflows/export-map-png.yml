name: Redraw terrain and river PNG assets

on:
  push:
    branches:
      - assets/png-map-export
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redraw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assets/png-map-export
      - name: Install render tools
        run: sudo apt-get update && sudo apt-get install -y inkscape imagemagick
      - name: Redraw terrain and river PNGs in place
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          mapfile -d '' sources < <(
            find public/Art/Map/Tiles -type f -name '*.svg' -print0 |
              grep -zE '/(Autotile/GrassEdge|Ground/(Grass|Dirt|Stone)|Height/Cliff|Water/River)/'
          )

          for svg in "${sources[@]}"; do
            rel="${svg#public/Art/Map/}"
            out="public/Art/Map/PNG/${rel%.svg}.png"
            mkdir -p "$(dirname "$out")"

            inkscape "$svg" --export-type=png --export-filename="$tmp_dir/base.png" >/dev/null 2>&1
            convert "$tmp_dir/base.png" -alpha extract "$tmp_dir/alpha.png"
            convert "$tmp_dir/base.png" -colorspace sRGB -modulate 104,68,100 "$tmp_dir/color.png"
            convert "$tmp_dir/base.png" -background white -alpha remove -alpha off               -colorspace gray -edge 0.75 -negate -threshold 72% "$tmp_dir/line.png"
            convert "$tmp_dir/color.png" "$tmp_dir/line.png"               -compose Multiply -composite "$tmp_dir/alpha.png"               -alpha off -compose CopyOpacity -composite -strip "$out"
          done

          expected="${#sources[@]}"
          test "$expected" -eq 107
          echo "Redrew $expected terrain and river PNG assets"
      - name: Commit redrawn PNGs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/Art/Map/PNG
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "assets: redraw terrain and river PNGs in sketch style"
          git push origin HEAD:assets/png-map-export
