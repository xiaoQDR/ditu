name: Export map SVG assets to PNG

on:
  push:
    branches:
      - assets/png-map-export
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assets/png-map-export
      - name: Install SVG renderer
        run: sudo apt-get update && sudo apt-get install -y inkscape
      - name: Export PNG assets
        shell: bash
        run: |
          set -euo pipefail
          find public/Art/Map -type f -name '*.svg' -print0 |
          while IFS= read -r -d '' svg; do
            rel="${svg#public/Art/Map/}"
            out="public/Art/Map/PNG/${rel%.svg}.png"
            mkdir -p "$(dirname "$out")"
            inkscape "$svg" --export-type=png --export-filename="$out"
          done
          test "$(find public/Art/Map/PNG -type f -name '*.png' | wc -l)" -eq "$(find public/Art/Map -type f -name '*.svg' | wc -l)"
      - name: Commit PNG exports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/Art/Map/PNG
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "assets: export map SVGs as PNG"
          git push origin HEAD:assets/png-map-export
